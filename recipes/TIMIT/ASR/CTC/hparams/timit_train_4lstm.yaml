##################################################
# Model: CTC ASR on TIMIT with LSTM-based encoder #
##################################################

# Seed needs to be set at top of yaml
seed: 1986
__set_seed: !apply:torch.manual_seed [!ref <seed>]

# Save folder for exp results
output_folder: !ref results/Encoder_2ms_16chan_4xLSTM_512
test_wer_file: !ref <output_folder>/test_wer.txt
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# Dataset
data_folder: /idiap/temp/evida/data/TIMIT/TIMIT dataset/data  # /path/to/TIMIT
train_annotation: !ref <save_folder>/train.json
valid_annotation: !ref <save_folder>/dev.json
test_annotation: !ref <save_folder>/test.json
skip_prep: False
uppercase: True

# Data for augmentation
data_folder_noise: !ref noise_data # The noisy sequences for data augmentation will automatically be downloaded here.
NOISE_DATASET_URL: https://www.dropbox.com/scl/fi/a09pj97s5ifan81dqhi4n/noises.zip?rlkey=j8b0n9kdjdr32o1f06t0cw5b7&dl=1
noise_annotation: !ref <save_folder>/noise.csv # The data manifest files are created by the data preparation script

# Training parameters
number_of_epochs: 50
batch_size: 8
sorting: ascending
lr: 1.e-3
annealing_factor: 0.8
annealing_patience: 0

# Feature parameters
sample_rate: 16000
n_fft: 400
n_mels: 80
window_length: 25
hop_length: 2

# Encoder parameters (CNN auditory)
auditory_channels: [16]
auditory_kernel_size: (7, 7)
auditory_frequency_stride: 1

# LSTM parameters
lstm_hidden: 512
lstm_layers: 4
lstm_bidirectional: True
lstm_dropout: 0.15

# Phoneme output parameters
phoneme_ctc_rate_hz: 25
phoneme_num_layers: 2
phoneme_features: 512
activation: !name:torch.nn.LeakyReLU
dropout: 0.15

# Output classifier
vocab_size: 40
blank_index: 0

# Dataloader options
num_workers: 4
train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

test_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

# Data augmentations
prepare_noise_data: !name:speechbrain.augment.preparation.prepare_dataset_from_URL
    URL: !ref <NOISE_DATASET_URL>
    dest_folder: !ref <data_folder_noise>
    ext: wav
    csv_file: !ref <noise_annotation>

add_noise: !new:speechbrain.augment.time_domain.AddNoise
    csv_file: !ref <noise_annotation>
    snr_low: 0
    snr_high: 15
    noise_sample_rate: !ref <sample_rate>
    clean_sample_rate: !ref <sample_rate>
    num_workers: !ref <num_workers>

speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: [95, 100, 105]

drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: 0
    drop_freq_high: 1
    drop_freq_count_low: 1
    drop_freq_count_high: 3
    drop_freq_width: 0.05

drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: 1000
    drop_length_high: 2000
    drop_count_low: 1
    drop_count_high: 5

wav_augment: !new:speechbrain.augment.augmenter.Augmenter
    concat_original: True
    min_augmentations: 4
    max_augmentations: 4
    augment_prob: 1.0
    augmentations: [
        !ref <add_noise>,
        !ref <speed_perturb>,
        !ref <drop_freq>,
        !ref <drop_chunk>]

# Waveform to phoneme probabilities pipeline
compute_features: !new:speechbrain.lobes.features.Fbank
    sample_rate: !ref <sample_rate>
    n_fft: !ref <n_fft>
    n_mels: !ref <n_mels>
    win_length: !ref <window_length>
    hop_length: !ref <hop_length>

normalize: !new:speechbrain.processing.features.InputNormalization
    norm_type: global

# CNN auditory feature extraction
cnn_auditory: !new:torch.nn.Sequential
    - !new:torch.nn.Conv2d
        in_channels: 1
        out_channels: !ref <auditory_channels>[0]
        kernel_size: !ref <auditory_kernel_size>
        stride: (1, !ref <auditory_frequency_stride>[0])
        padding: (!ref <auditory_kernel_size>[0], 0)
    - !name:torch.nn.ReLU

# LSTM layers for cortex processing
lstm: !new:speechbrain.nnet.RNN.LSTM
    input_size: 416  # This will be set dynamically in the code (auditory_channels * num_feats_after_cnn)
    hidden_size: !ref <lstm_hidden>
    num_layers: !ref <lstm_layers>
    dropout: !ref <lstm_dropout>
    bidirectional: !ref <lstm_bidirectional>
    batch_first: True

# Phoneme output layers
linear_phoneme: !new:torch.nn.Sequential
    - !new:torch.nn.Linear
        in_features: !ref <lstm_hidden>
        out_features: !ref <phoneme_features>
    - !ref <activation>
    - !new:torch.nn.Dropout
        p: !ref <dropout>
    - !new:torch.nn.Linear
        in_features: !ref <phoneme_features>
        out_features: !ref <phoneme_features>
    - !ref <activation>
    - !new:torch.nn.Dropout
        p: !ref <dropout>

classifier: !new:speechbrain.nnet.linear.Linear
    input_size: !ref <phoneme_features>
    n_neurons: !ref <vocab_size>
    bias: True

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

modules:
    normalize: !ref <normalize>
    cnn_auditory: !ref <cnn_auditory>
    lstm: !ref <lstm>
    linear_phoneme: !ref <linear_phoneme>
    classifier: !ref <classifier>

# Compute loss
compute_cost: !name:speechbrain.nnet.losses.ctc_loss
    blank_index: !ref <blank_index>

# Training utils
opt_class: !name:torch.optim.Adam
    lr: !ref <lr>

lr_annealing: !new:speechbrain.nnet.schedulers.NewBobScheduler
    initial_value: !ref <lr>
    improvement_threshold: 0.0025
    annealing_factor: !ref <annealing_factor>
    patient: !ref <annealing_patience>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        normalize: !ref <normalize>
        cnn_auditory: !ref <cnn_auditory>
        lstm: !ref <lstm>
        linear_phoneme: !ref <linear_phoneme>
        classifier: !ref <classifier>
        scheduler: !ref <lr_annealing>
        counter: !ref <epoch_counter>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

ctc_stats: !name:speechbrain.utils.metric_stats.MetricStats
    metric: !name:speechbrain.nnet.losses.ctc_loss
        blank_index: !ref <blank_index>
        reduction: batch

per_stats: !name:speechbrain.utils.metric_stats.ErrorRateStats
